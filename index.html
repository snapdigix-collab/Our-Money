
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR MONEY | Joint Finance</title>

<style>
:root {
  --bg:#0b0f14;
  --panel:#141a22;
  --line:#252e39;
  --text:#f4f6f8;
  --muted:#8d9aaa;
  --orange:#ff8a00;
  --green:#35d39a;
  --red:#ff647c;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;padding:20px;
}
.app{max-width:1100px;margin:auto}
header{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:25px;
}
.brand{font-size:25px;font-weight:800;letter-spacing:1px}
.brand span{color:var(--orange)}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
select,input,textarea,button{font:inherit}
select,input,textarea{
  width:100%;background:#0e131a;color:white;
  border:1px solid var(--line);padding:12px;
  border-radius:10px;outline:none;
}
select:focus,input:focus,textarea:focus{border-color:var(--orange)}
button{
  border:0;border-radius:10px;padding:12px 16px;
  background:var(--orange);font-weight:700;
  cursor:pointer;color:#17100a;
}
button:disabled{opacity:.6;cursor:wait}
.profile{width:auto;min-width:140px}
.cards{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:14px;margin-bottom:20px;
}
.card,.panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:18px;
}
.card small{color:var(--muted)}
.amount{font-size:25px;font-weight:800;margin-top:10px}
.income{color:var(--green)}
.expense{color:var(--red)}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px}
h2{font-size:17px;margin:0 0 16px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.table-wrap{overflow-x:auto}
.status{font-size:12px;color:var(--muted);margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:25px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
@media(max-width:520px){
  body{padding:12px}
  .cards{grid-template-columns:1fr}
  .card{padding:15px}
  .amount{font-size:22px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <div class="brand">OUR <span>MONEY</span></div>
    <div class="sub">Together, managing our money.</div>
  </div>
  <select class="profile" id="profile">
    <option value="Nitesh">Nitesh</option>
    <option value="Kajal">Kajal</option>
  </select>
</header>

<section class="cards">
  <div class="card">
    <small>Total Income</small>
    <div class="amount income" id="income">₹0</div>
  </div>
  <div class="card">
    <small>Total Expenses</small>
    <div class="amount expense" id="expenses">₹0</div>
  </div>
  <div class="card">
    <small>Current Balance</small>
    <div class="amount" id="balance">₹0</div>
  </div>
</section>

<div class="layout">

<section class="panel">
<h2>＋ Add Transaction</h2>

<form id="txnForm">

  <div class="row">
    <div class="field">
      <label>Date</label>
      <input type="date" name="date" id="date" required>
    </div>
    <div class="field">
      <label>Type</label>
      <select name="type" id="type">
        <option>Income</option>
        <option>Expense</option>
        <option>Transfer</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Category</label>
    <input name="category" placeholder="Salary, groceries, rent..." required>
  </div>

  <div class="field">
    <label>Description</label>
    <input name="description" placeholder="Short details">
  </div>

  <div class="row">
    <div class="field">
      <label>Amount (₹)</label>
      <input name="amount" type="number" min="0.01" step="0.01" required>
    </div>
    <div class="field">
      <label>Payment Mode</label>
      <select name="paymentMode">
        <option>UPI</option>
        <option>Cash</option>
        <option>Bank</option>
        <option>Card</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Account</label>
    <select name="account">
      <option>Joint Account</option>
      <option>Nitesh</option>
      <option>Kajal</option>
      <option>Cash</option>
    </select>
  </div>

  <div class="field">
    <label>Notes</label>
    <textarea name="notes" rows="2" placeholder="Optional"></textarea>
  </div>

  <button type="submit" id="saveBtn" style="width:100%">
    SAVE TRANSACTION
  </button>

  <div class="status" id="formStatus"></div>
</form>
</section>

<section class="panel">
<h2>Recent Transactions</h2>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Date</th>
  <th>Details</th>
  <th>By</th>
  <th>Amount</th>
</tr>
</thead>
<tbody id="transactions">
<tr><td colspan="4" class="empty">Loading...</td></tr>
</tbody>
</table>
</div>

<div class="status" id="loadStatus"></div>
<button type="button" onclick="loadTransactions()" style="margin-top:12px">
  REFRESH
</button>
</section>

</div>

<div class="footer">OUR MONEY · Joint Finance Management</div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwy2GtRDAwLk1wZNbP3GnfzgzXRRlEP-U7RF6PIyKVhdJR6MZnQIhgnyFhUda1cQ8kl/exec";

const form = document.getElementById("txnForm");
const profile = document.getElementById("profile");
const statusBox = document.getElementById("formStatus");
const tableBody = document.getElementById("transactions");
const saveBtn = document.getElementById("saveBtn");

document.getElementById("date").value =
  new Date().toLocaleDateString("en-CA");

function money(value){
  return "₹" + Number(value || 0).toLocaleString("en-IN",{
    maximumFractionDigits:2
  });
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

async function loadTransactions(){
  document.getElementById("loadStatus").textContent =
    "Connecting to Google Sheets...";

  try{
    const response = await fetch(
      SCRIPT_URL + "?action=transactions"
    );

    const result = await response.json();

    if(!result.success) throw new Error("Backend error");

    const rows = result.data || [];
    let income = 0;
    let expenses = 0;

    rows.forEach(item=>{
      const amount = Number(item.Amount || 0);

      if(item.Type === "Income") income += amount;
      if(item.Type === "Expense") expenses += amount;
    });

    document.getElementById("income").textContent = money(income);
    document.getElementById("expenses").textContent = money(expenses);
    document.getElementById("balance").textContent =
      money(income-expenses);

    const recent = rows.slice(-15).reverse();

    if(!recent.length){
      tableBody.innerHTML =
        '<tr><td colspan="4" class="empty">No transactions yet</td></tr>';
    }else{
      tableBody.innerHTML = recent.map(item=>{
        const isIncome = item.Type === "Income";
        const isExpense = item.Type === "Expense";
        const sign = isIncome ? "+" : isExpense ? "−" : "";

        return `<tr>
          <td>${escapeHTML(item.Date)}</td>
          <td>
            ${escapeHTML(item.Category)}
            <br><small>${escapeHTML(item.Description)}</small>
          </td>
          <td>${escapeHTML(item.Added_By)}</td>
          <td class="${isIncome?'income':isExpense?'expense':''}">
            ${sign}${money(item.Amount)}
          </td>
        </tr>`;
      }).join("");
    }

    document.getElementById("loadStatus").textContent =
      "Synced with Google Sheets";

  }catch(error){
    document.getElementById("loadStatus").textContent =
      "Connection failed. Check Apps Script deployment access.";
    tableBody.innerHTML =
      '<tr><td colspan="4" class="empty">Unable to load data</td></tr>';
  }
}

form.addEventListener("submit", async event=>{
  event.preventDefault();

  if(!form.reportValidity()) return;

  saveBtn.disabled = true;
  saveBtn.textContent = "SAVING...";
  statusBox.textContent = "";

  const data = new URLSearchParams(new FormData(form));
  data.append("action","addTransaction");
  data.append("addedBy",profile.value);

  try{
    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      body:data
    });

    statusBox.textContent =
      "Submitted. Checking Google Sheets...";
    form.reset();

    document.getElementById("date").value =
      new Date().toLocaleDateString("en-CA");

    setTimeout(loadTransactions,2000);

  }catch(error){
    statusBox.textContent =
      "Submission failed. Please try again.";
  }

  saveBtn.disabled = false;
  saveBtn.textContent = "SAVE TRANSACTION";
});

loadTransactions();
</script>
</body>
</html>
